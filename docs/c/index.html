<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Convite para o Nexo</title>
<meta property="og:title" content="Convite para um servidor no Nexo">
<meta property="og:description" content="Clique para entrar. Chat, voz e lives entre amigos, P2P e cifrado.">
<meta property="og:site_name" content="Nexo">
<meta property="og:image" content="https://enrell.github.io/nexo/icon.png">
<meta name="theme-color" content="#dd8566">
<link rel="icon" href="../logo.svg">
<link rel="stylesheet" href="../style.css">
<script src="invite.js" defer></script>

<body>
<main>
  <img src="../logo.svg" alt="" width="64" height="64">
  <h1 id="title">Convite para o Nexo</h1>
  <p id="msg" class="dim">Abrindo o Nexo…</p>
  <div class="actions" id="actions" hidden>
    <a class="btn" id="open" href="#">Abrir no Nexo</a>
    <a class="btn ghost" href="https://github.com/enrell/nexo/releases/latest">Baixar o Nexo</a>
  </div>
  <div id="manual" hidden>
    <p class="dim small">Não abriu? Copie o código e cole em “Entrar com convite” no Nexo.</p>
    <button class="btn ghost" id="copy" type="button">Copiar código</button>
  </div>
</main>

</html>
