name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # testes ponta a ponta com várias instâncias reais (usa relays públicos)
      - run: node tests/e2e.mjs
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # tag v* → publica o instalador numa Release; os apps instalados se atualizam sozinhos
      - if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Nexo-Setup
          path: release/*.exe
