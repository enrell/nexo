name: release

# Publica uma versão quando uma tag vX.Y.Z é enviada. Veja .claude/skills/release/SKILL.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # criar a release e enviar o instalador
  id-token: write # atestado de procedência
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Conferir tag, versão e changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "::error::tag v$TAG diferente do package.json ($PKG)"; exit 1; fi
          node scripts/release-notes.mjs "$TAG" > release-notes.md
          echo "Notas da release:"; cat release-notes.md

      - run: npm ci
      - name: Binário do Electron
        shell: bash
        run: |
          node node_modules/electron/install.js
          test -f node_modules/electron/dist/electron.exe && echo "electron.exe ok"
      - run: npm run typecheck
      - run: npm run build
      - name: Testes unitários (com limite mínimo de cobertura)
        run: npm run test:cov
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Teste ponta a ponta
        shell: bash
        env:
          DEBUG: pw:browser
        run: node tests/e2e.mjs || node tests/e2e.mjs

      # o rascunho precisa existir ANTES do electron-builder: sem ele, os envios em paralelo
      # criam uma release cada (aconteceu na v0.3.0)
      - name: Criar a release em rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag --title "Nexo $GITHUB_REF_NAME" --notes-file release-notes.md

      - name: Gerar e publicar instalador (release em rascunho)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # o instalador não tem assinatura da Microsoft: a atualização automática confia na chave do projeto.
      # O segredo é a chave privada (scripts/update-keygen.mjs); o app só aceita o que ela assinou.
      - name: Assinar a atualização (chave do projeto)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::falta o segredo UPDATE_SIGNING_KEY (gh secret set UPDATE_SIGNING_KEY < chave.pem)"; exit 1; }
          node scripts/sign-update.mjs release/latest.yml
          gh release upload "$GITHUB_REF_NAME" release/latest.yml --clobber -R "$GITHUB_REPOSITORY"

      - name: SHA256SUMS
        shell: bash
        run: cd release && sha256sum Nexo-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Atestado de procedência do instalador
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Nexo-Setup-*.exe

      - name: Notas, checksums e publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # exatamente uma release para a tag, com instalador e latest.yml (senão o auto-update quebra)
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")
          if [ "$COUNT" != "1" ]; then echo "::error::$COUNT releases para $GITHUB_REF_NAME"; exit 1; fi
          ASSETS=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(" ")')
          for f in "Nexo-Setup-${GITHUB_REF_NAME#v}.exe" latest.yml; do
            case " $ASSETS " in *" $f "*) ;; *) echo "::error::falta $f na release"; exit 1;; esac
          done
          # a release publicada tem que carregar a assinatura: sem ela, nenhum app instalado aceitaria a atualização
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.yml -O - | grep -q '^nexoSignature: ' || { echo "::error::latest.yml da release sem nexoSignature"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
          {
            cat release-notes.md
            echo
            echo "---"
            echo "**Instalar:** baixe \`Nexo-Setup-${GITHUB_REF_NAME#v}.exe\` abaixo. Quem já tem o Nexo recebe a atualização sozinho."
            echo
            echo "**Verificar o download:** confira o \`SHA256SUMS.txt\` ou rode \`gh attestation verify Nexo-Setup-${GITHUB_REF_NAME#v}.exe -R $GITHUB_REPOSITORY\`."
          } > final-notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Nexo $GITHUB_REF_NAME" --notes-file final-notes.md --draft=false --latest
